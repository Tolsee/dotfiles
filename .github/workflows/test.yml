name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh shellcheck jq
          # fzf/fzfrc needs fzf 0.45+ (transform actions); apt ships older.
          curl -fsSL https://github.com/junegunn/fzf/releases/download/v0.67.0/fzf-0.67.0-linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin fzf
          python -m pip install -q 'tomlkit>=0.13,<1'
      - name: ./test
        run: TEST_STRICT=1 ./test
