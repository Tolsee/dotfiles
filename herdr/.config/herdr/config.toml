onboarding = false

[theme]
name = "tokyo-night"

[theme.custom]
panel_bg = "#222436"
# Focused sidebar row: TokyoNight Moon bg_visual, clearly distinct from panel_bg.
active_row_bg = "#2f334d"
selection_bg = "#3b4261"
accent = "#82aaff"
blue = "#82aaff"
yellow = "#ffc777"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

# Task worktrees created by ~/bin/herdr-task live outside the repos.
[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+b"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
close_workspace = "prefix+shift+q"
new_tab = "prefix+c"
switch_tab = "prefix+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", 'prefix+"']
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
new_worktree = "prefix+shift+g"
remove_worktree = "prefix+shift+x"

# Popups load the private shell config (HERDR_TASK_PROJECT_ROOTS and friends) without the
# full interactive zsh startup, so they open instantly.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "zsh -c 'source ~/.secrets.zshrc 2>/dev/null; exec ~/bin/herdr-sessionizer'"
description = "open or create a project workspace"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh -c 'source ~/.secrets.zshrc 2>/dev/null; exec ~/bin/herdr-task'"
description = "start a task from a Linear link, issue id or branch name in its own worktree workspace"
width = "80%"
height = "80%"

# A popup rather than a detached shell so the picker can show when there are several links.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "~/bin/herdr-task open"
description = "open the focused agent's ticket or PR in the browser"
width = "50%"
height = "30%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "zsh -c 'source ~/.secrets.zshrc 2>/dev/null; exec ~/bin/herdr-task prune'"
description = "remove task worktrees whose branch has merged"
width = "80%"
height = "80%"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true
pane_scrollbars = false
pane_gaps = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
accent = "#82aaff"
agent_panel_sort = "spaces"

# Space rows: the task label, then the Linear ticket (reported by herdr-task) in Linear's brand color.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$hs_space" }, { token = "$hs_space_dim", dim = true }],
  [{ token = "$linear", fg = "#7a88cf" }, { token = "$repo", dim = true }],
]

# Agent rows: state and agent (the agent label carries a Nerd Font glyph per kind, reported
# as pane metadata by herdr-task and the Claude SessionStart hook), the session's current
# task (its terminal title), then the Linear ticket and PR reported onto the pane.
# Agent rows: workspace > tab > agent tree from testy-cool/herdr-sidebar-config ($hs_* tokens),
# plus our own rows (what the agent is doing, Linear ticket, PR). The plugin's setup step must
# not run: it would replace this table. Per-agent colors follow the plugin's defaults.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$hs_group", bold = true, fg = "#A8ADB9" }, { token = "$hs_group_dim", dim = true, fg = "#A8ADB9" }],
  [{ token = "$hs_tab", fg = "#A8ADB9" }, { token = "$hs_tab_dim", fg = "#A8ADB9", dim = true }],
  [
    { token = "$hs_logo", fg = "#A8ADB9" },
    { token = "$hs_logo_kimchi", fg = "#FF521D" },
    { token = "$hs_logo_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_working", fg = "#A8ADB9" },
    { token = "$hs_working_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_blocked", fg = "#F08080" },
    { token = "$hs_blocked_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_done", fg = "#91C788" },
    { token = "$hs_done_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_idle", fg = "#A8ADB9" },
    { token = "$hs_idle_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_unknown", fg = "#A8ADB9" },
    { token = "$hs_unknown_dim", fg = "#A8ADB9", dim = true },
  ],
  [{ token = "$linear", fg = "#7a88cf" }, { token = "$pr", fg = "#7a88cf" }],
  [{ token = "$hs_gap" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$hs_group", bold = true, fg = "#A8ADB9" }, { token = "$hs_group_dim", dim = true, fg = "#A8ADB9" }],
  [{ token = "$hs_tab", fg = "#A8ADB9" }, { token = "$hs_tab_dim", fg = "#A8ADB9", dim = true }],
  [
    { token = "$hs_logo", fg = "#E68A67" },
    { token = "$hs_logo_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_working", fg = "#E68A67" },
    { token = "$hs_working_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_blocked", fg = "#F08080" },
    { token = "$hs_blocked_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_done", fg = "#91C788" },
    { token = "$hs_done_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_idle", fg = "#A8ADB9" },
    { token = "$hs_idle_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_unknown", fg = "#A8ADB9" },
    { token = "$hs_unknown_dim", fg = "#A8ADB9", dim = true },
  ],
  [{ token = "$linear", fg = "#7a88cf" }, { token = "$pr", fg = "#7a88cf" }],
  [{ token = "$hs_gap" }],
]
codex = [
  [{ token = "$hs_group", bold = true, fg = "#A8ADB9" }, { token = "$hs_group_dim", dim = true, fg = "#A8ADB9" }],
  [{ token = "$hs_tab", fg = "#A8ADB9" }, { token = "$hs_tab_dim", fg = "#A8ADB9", dim = true }],
  [
    { token = "$hs_logo", fg = "#A78BFA" },
    { token = "$hs_logo_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_working", fg = "#A78BFA" },
    { token = "$hs_working_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_blocked", fg = "#F08080" },
    { token = "$hs_blocked_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_done", fg = "#91C788" },
    { token = "$hs_done_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_idle", fg = "#A8ADB9" },
    { token = "$hs_idle_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_unknown", fg = "#A8ADB9" },
    { token = "$hs_unknown_dim", fg = "#A8ADB9", dim = true },
  ],
  [{ token = "$linear", fg = "#7a88cf" }, { token = "$pr", fg = "#7a88cf" }],
  [{ token = "$hs_gap" }],
]

[ui.toast]
delivery = "system"
delay_seconds = 2

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
allow_nested = false
pane_history = false
