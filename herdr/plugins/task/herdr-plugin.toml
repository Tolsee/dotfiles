id = "dotfiles.task"
name = "Task"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "herdr-task from keys and links: review and ship the focused task, start Linear links as tasks, open file links in the editor."
platforms = ["linux", "macos"]

# Bound in config.toml as plugin_action keys (prefix+y, prefix+u).
[[actions]]
id = "review"
title = "Review branch (Codex + Claude)"
contexts = ["workspace"]
command = ["sh", "run.sh", "review"]

[[actions]]
id = "ship"
title = "Ship task"
contexts = ["workspace"]
command = ["sh", "run.sh", "ship"]

# Link handler targets (Ctrl-click, mouse capture on).
[[actions]]
id = "start-link"
title = "Start link as a task"
contexts = ["workspace"]
command = ["sh", "run.sh", "start-link"]

[[actions]]
id = "open-file"
title = "Open file in editor"
contexts = ["workspace"]
command = ["sh", "run.sh", "open-file"]

# The prefix+t popup, prefilled with the clicked link.
[[panes]]
id = "start"
title = "Start task"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "run.sh", "start"]

[[link_handlers]]
id = "linear-issue"
title = "Start Linear issue as a task"
pattern = "^https://linear\\.app/[^/]+/issue/[A-Za-z][A-Za-z0-9]*-[0-9]+"
action = "start-link"

# Agents print file paths as file:// links (FORCE_HYPERLINK=1); Herdr opens only http(s).
[[link_handlers]]
id = "file"
title = "Open file in editor"
pattern = "^file://"
action = "open-file"
